[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "bambu-print-monitor"
version = "1.1.0"
description = "LAN-only status monitoring library + web dashboard for Bambu Lab 3D printers"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = ["paho-mqtt>=2.0"]

[project.urls]
Homepage = "https://github.com/Heyjoy/bambu-print-monitor"

[tool.setuptools]
packages = ["bambu_monitor"]
